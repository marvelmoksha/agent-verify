[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-verify"
version = "0.0.1"
description = "Multi-agent code solver with verifiable guarantees"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40",
  "datasets>=2.19",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "hypothesis>=6.100"]

[tool.setuptools.packages.find]
include = ["llm*", "benchmarks*", "common*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
